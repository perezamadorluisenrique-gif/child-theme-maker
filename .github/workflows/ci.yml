name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-unit:
    name: PHP ${{ matrix.php }} lint and unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - name: php -l
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - name: PHPCS (WordPress Coding Standards + PHP 7.4 compatibility)
        if: matrix.php == '8.3'
        run: vendor/bin/phpcs

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bin/build.sh
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/child-theme-maker
          include-experimental: true

  e2e:
    name: Browser test on WordPress ${{ matrix.wp }}${{ matrix.multisite && ' multisite' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: '7.1.3'
            block: twentytwentyfive
          - wp: '6.3'
            block: twentytwentythree
          - wp: '7.1.3'
            block: twentytwentyfive
            multisite: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: bin/e2e.sh
        env:
          WP_VERSION: ${{ matrix.wp }}
          BLOCK_PARENT: ${{ matrix.block }}
          MULTISITE: ${{ matrix.multisite }}
